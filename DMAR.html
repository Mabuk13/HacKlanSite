<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Virtual Browser</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Segoe UI, Arial, sans-serif;
}

body {
    background: #111827;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* TAB BAR */
#tabs {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 8px 0;
    background: #111827;
    min-height: 45px;
    overflow-x: auto;
}

.tab {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 150px;
    max-width: 220px;
    padding: 9px 12px;
    background: #1f2937;
    color: #9ca3af;
    border-radius: 9px 9px 0 0;
    cursor: pointer;
    user-select: none;
}

.tab.active {
    background: #374151;
    color: white;
}

.tab-title {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.close-tab {
    color: #9ca3af;
    font-size: 15px;
}

.close-tab:hover {
    color: white;
}

#newTab {
    background: #1f2937;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    width: 35px;
    height: 35px;
    cursor: pointer;
}

#newTab:hover {
    background: #374151;
}

/* TOOLBAR */
.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    background: #1f2937;
    border-bottom: 1px solid #374151;
}

button {
    background: #374151;
    border: none;
    color: white;
    padding: 9px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
    transition: .2s;
}

button:hover {
    background: #4b5563;
}

#url {
    flex: 1;
    padding: 10px 16px;
    border: 2px solid #374151;
    border-radius: 30px;
    background: #111827;
    color: white;
    outline: none;
    font-size: 15px;
}

#url:focus {
    border-color: #3b82f6;
}

/* BROWSER AREA */
#browserArea {
    flex: 1;
    position: relative;
    background: white;
}

.browser-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: white;
    display: none;
}

.browser-frame.active {
    display: block;
}

/* STATUS */
.status {
    background: #1f2937;
    color: #9ca3af;
    padding: 7px 15px;
    font-size: 13px;
}
</style>
</head>

<body>

<!-- TABS -->
<div id="tabs">
    <button id="newTab" onclick="createTab()">+</button>
</div>

<!-- TOOLBAR -->
<div class="toolbar">

    <button onclick="back()">←</button>
    <button onclick="forward()">→</button>
    <button onclick="refresh()">⟳</button>

    <input
        id="url"
        placeholder="Search or enter website..."
        onkeydown="if(event.key === 'Enter') go()"
    >

    <button onclick="go()">Go</button>

</div>

<!-- BROWSER -->
<div id="browserArea"></div>

<!-- STATUS -->
<div class="status" id="status">
    Ready
</div>

<script>

let tabs = [];
let activeTab = null;
let tabCounter = 0;

const tabsContainer = document.getElementById("tabs");
const browserArea = document.getElementById("browserArea");
const box = document.getElementById("url");
const status = document.getElementById("status");


/* =========================
   CREATE TAB
========================= */

function createTab(url = "about:blank") {

    tabCounter++;

    const id = tabCounter;

    const tab = {
        id: id,
        title: "New Tab",
        url: url
    };

    tabs.push(tab);

    /* TAB BUTTON */

    const tabElement = document.createElement("div");

    tabElement.className = "tab";
    tabElement.id = "tab-" + id;

    tabElement.innerHTML = `
        <span class="tab-title">New Tab</span>
        <span class="close-tab"
              onclick="closeTab(event, ${id})">×</span>
    `;

    tabElement.onclick = function() {
        switchTab(id);
    };

    tabsContainer.insertBefore(
        tabElement,
        document.getElementById("newTab")
    );


    /* IFRAME */

    const frame = document.createElement("iframe");

    frame.className = "browser-frame";
    frame.id = "frame-" + id;
    frame.src = url;

    frame.onload = function() {

        if (activeTab === id) {
            status.textContent = "Finished loading";
        }

        updateTitle(id);
    };

    browserArea.appendChild(frame);


    switchTab(id);
}


/* =========================
   SWITCH TAB
========================= */

function switchTab(id) {

    activeTab = id;

    /* Update tab buttons */

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
    });

    const selectedTab =
        document.getElementById("tab-" + id);

    if (selectedTab) {
        selectedTab.classList.add("active");
    }


    /* Update frames */

    document.querySelectorAll(".browser-frame").forEach(frame => {
        frame.classList.remove("active");
    });

    const frame =
        document.getElementById("frame-" + id);

    if (frame) {
        frame.classList.add("active");
    }


    /* Update address bar */

    const tab = getTab(id);

    if (tab) {
        box.value =
            tab.url === "about:blank"
            ? ""
            : tab.url;
    }

    status.textContent = "Ready";
}


/* =========================
   CLOSE TAB
========================= */

function closeTab(event, id) {

    event.stopPropagation();

    const index =
        tabs.findIndex(tab => tab.id === id);

    if (index === -1) return;


    /* Remove iframe */

    const frame =
        document.getElementById("frame-" + id);

    if (frame) {
        frame.remove();
    }


    /* Remove tab */

    const tabElement =
        document.getElementById("tab-" + id);

    if (tabElement) {
        tabElement.remove();
    }


    tabs.splice(index, 1);


    /* If no tabs remain */

    if (tabs.length === 0) {
        createTab();
        return;
    }


    /* Switch to another tab */

    if (activeTab === id) {

        const newIndex =
            Math.max(0, index - 1);

        switchTab(tabs[newIndex].id);
    }
}


/* =========================
   GET TAB
========================= */

function getTab(id) {

    return tabs.find(tab => tab.id === id);
}


/* =========================
   URL CHECK
========================= */

function isURL(text) {

    return (
        text.includes(".") ||
        text.startsWith("http://") ||
        text.startsWith("https://") ||
        text.startsWith("localhost")
    );
}


/* =========================
   GO
========================= */

function go() {

    if (activeTab === null) return;

    let input =
        box.value.trim();

    if (input === "") return;


    let url;


    /* WEBSITE */

    if (isURL(input)) {

        if (
            !input.startsWith("http://") &&
            !input.startsWith("https://")
        ) {
            input = "https://" + input;
        }

        url = input;

    }

    /* SEARCH */

    else {

        url =
            "https://duckduckgo.com/?q=" +
            encodeURIComponent(input);
    }


    const tab =
        getTab(activeTab);

    const frame =
        document.getElementById(
            "frame-" + activeTab
        );


    if (!tab || !frame) return;


    tab.url = url;
    tab.title = "Loading...";


    status.textContent =
        "Loading " + url + "...";


    frame.src = url;


    updateTabTitle(
        activeTab,
        "Loading..."
    );
}


/* =========================
   BACK
========================= */

function back() {

    const frame =
        document.getElementById(
            "frame-" + activeTab
        );

    if (!frame) return;

    try {
        frame.contentWindow.history.back();
    }
    catch (error) {
        status.textContent =
            "Cannot go back on this page.";
    }
}


/* =========================
   FORWARD
========================= */

function forward() {

    const frame =
        document.getElementById(
            "frame-" + activeTab
        );

    if (!frame) return;

    try {
        frame.contentWindow.history.forward();
    }
    catch (error) {
        status.textContent =
            "Cannot go forward on this page.";
    }
}


/* =========================
   REFRESH
========================= */

function refresh() {

    const frame =
        document.getElementById(
            "frame-" + activeTab
        );

    if (!frame) return;

    status.textContent =
        "Refreshing...";

    try {
        frame.contentWindow.location.reload();
    }
    catch {
        frame.src = frame.src;
    }
}


/* =========================
   UPDATE TITLE
========================= */

function updateTitle(id) {

    const frame =
        document.getElementById(
            "frame-" + id
        );

    const tab =
        getTab(id);

    if (!frame || !tab) return;


    try {

        const title =
            frame.contentDocument.title;

        if (title) {
            tab.title = title;
            updateTabTitle(id, title);
        }

    }
    catch {

        /*
        Cross-origin websites cannot have
        their title read by this page.
        */

        updateTabTitle(
            id,
            tab.url
                .replace(/^https?:\/\//, "")
                .split("/")[0]
        );
    }
}


/* =========================
   UPDATE TAB TEXT
========================= */

function updateTabTitle(id, title) {

    const tabElement =
        document.getElementById(
            "tab-" + id
        );

    if (!tabElement) return;

    const titleElement =
        tabElement.querySelector(
            ".tab-title"
        );

    if (titleElement) {
        titleElement.textContent = title;
    }
}


/* =========================
   START
========================= */

createTab();

</script>

</body>
</html>
